name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - name: Work out the public site URL (always https)
        id: site
        run: |
          url="${{ vars.NEXT_PUBLIC_SITE_URL || steps.pages.outputs.base_url }}"
          echo "url=${url/http:\/\//https://}" >> "$GITHUB_OUTPUT"
      - name: Build static site
        run: npm run build
        env:
          # Everbound's Supabase project. The anon key is public by design (it ships in
          # every page); row-level security protects the data. Override with repository
          # Variables if you move projects. NEVER put the service_role key here.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || 'https://jaugxlhggxnsqmgdcvta.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphdWd4bGhnZ3huc3FtZ2RjdnRhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQyNDE1NDAsImV4cCI6MjEwOTgxNzU0MH0.HhBHUiTyB_YR50CG53-_aokEaNbd2vB0k1VP088e2ME' }}
          NEXT_PUBLIC_TIMEZONE: ${{ vars.NEXT_PUBLIC_TIMEZONE || 'America/New_York' }}
          # Your custom domain (or https://limelizardgames.github.io/everbound). QR codes use this.
          NEXT_PUBLIC_SITE_URL: ${{ steps.site.outputs.url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
